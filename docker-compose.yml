services:
  api:
    build: ./api
    environment:
      HEATWORK_DB: /data/heatwork.db
    volumes:
      - api-data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # 一次性验收服务：docker compose --profile verify up --build --exit-code-from verify
  verify:
    build: ./verify
    profiles: ["verify"]
    environment:
      API_BASE: http://api:8000
      WEB_BASE: http://web
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: "no"

volumes:
  api-data:
