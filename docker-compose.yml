services:
  api:
    build: ./api
    environment:
      HEATWORK_DB: /data/heatwork.db
    volumes:
      - api-data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    # 只探测自身 nginx 是否在服务；对 api 的启动顺序依赖由 depends_on 保证，
    # 端到端联通性由 verify 的「web 代理 /api 到后端」用例验收。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 升级前数据种子：向 api 的卷写入两条无分段明细的旧记录（模拟历史库）
  legacy-seed:
    build: ./verify
    profiles: ["verify"]
    command: ["python", "legacy_seed.py"]
    environment:
      API_BASE: http://api:8000
      HEATWORK_DB: /data/heatwork.db
    volumes:
      - api-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  # 一次性验收服务：docker compose --profile verify up --build --exit-code-from verify
  verify:
    build: ./verify
    profiles: ["verify"]
    environment:
      API_BASE: http://api:8000
      WEB_BASE: http://web
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      legacy-seed:
        condition: service_completed_successfully
    restart: "no"

volumes:
  api-data:
