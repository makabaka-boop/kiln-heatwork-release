server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS：运行期解析上游，避免 nginx 启动时一次性解析
    # 缓存住 api 的旧地址（api 容器重建后 IP 会变）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API 反向代理到 api 服务，前端与接口同源。
    # 变量形式的 proxy_pass 让 nginx 启动不依赖 api 的 DNS 是否已就绪，
    # 并按 resolver 周期重新解析；请求 URI 原样转发（/api/... -> /api/...）。
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
